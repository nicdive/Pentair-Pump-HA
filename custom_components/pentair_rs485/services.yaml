run_program:
  name: Run program
  description: Run an external pump program (0 = stop, 1-4 = program).
  fields:
    pump_index:
      name: Pump index
      description: Pump index configured in the integration (1-16).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    program:
      name: Program
      description: Program number (0 = stop).
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 4
          mode: box

save_program:
  name: Save program speed
  description: Save a RPM or GPM speed into a pump program slot (1-4).
  fields:
    pump_index:
      name: Pump index
      description: Pump index configured in the integration (1-16).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    program:
      name: Program
      description: Program slot to save (1-4).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    speed:
      name: Speed
      description: Speed value (RPM 450-3450 or GPM 15-130 depending on command profile).
      required: true
      example: 1500
      selector:
        number:
          min: 15
          max: 3450
          mode: box

set_speed:
  name: Set speed
  description: Run the pump at a RPM or GPM setpoint (starts the pump).
  fields:
    pump_index:
      name: Pump index
      description: Pump index configured in the integration (1-16).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    rpm:
      name: RPM
      description: Target speed in RPM (450-3450). Ignored if empty.
      required: false
      example: 1800
      selector:
        number:
          min: 450
          max: 3450
          step: 50
          mode: box
    gpm:
      name: GPM
      description: Target flow in GPM (15-130). Ignored if empty.
      required: false
      example: 40
      selector:
        number:
          min: 15
          max: 130
          mode: box

set_power:
  name: Set power
  description: Turn the pump on or off. On re-applies the last RPM/GPM setpoint when known.
  fields:
    pump_index:
      name: Pump index
      description: Pump index configured in the integration (1-16).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    power:
      name: Power
      description: True = start, False = stop.
      required: true
      example: true
      selector:
        boolean:
